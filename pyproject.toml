[project]
name = "is-dafeiyu"
version = "0.1.0"
description = "Binary image classifier to detect Dafeiyu (DeepSeek whale-girl mascot)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "timm>=1.0.12",
    "pillow>=11.0.0",
    "imagehash>=4.3.1",
    "scikit-learn>=1.5.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.0",
    "numpy>=2.0.0",
    "onnx>=1.17.0",
    "onnxscript>=0.2.0",
    "onnxruntime>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/is_dafeiyu"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
